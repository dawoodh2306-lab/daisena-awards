<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daisena Awards · Case No. 1993</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --gold:#d4af37; --bg:#0e0d0b; --ink:#f3ece0; --muted:#9a9184; }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at top, #2a2418 0%, var(--bg) 60%);
    color:var(--ink); font-family:Inter, system-ui, sans-serif; padding:24px; text-align:center;
  }
  .card { max-width:420px; }
  .tag { font-size:12px; letter-spacing:.3em; color:var(--gold); text-transform:uppercase; }
  h1 { font-family:"Playfair Display", serif; font-weight:800; font-size:42px; line-height:1.05; margin:18px 0 10px; }
  h1 span { color:var(--gold); }
  .line { width:56px; height:2px; background:var(--gold); margin:22px auto; }
  p { color:var(--muted); line-height:1.6; font-size:16px; }
  .stamp {
    display:inline-block; margin-top:28px; padding:8px 14px; border:2px solid #b3261e; color:#e05a4f;
    font-weight:600; letter-spacing:.15em; font-size:12px; transform:rotate(-4deg); text-transform:uppercase;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="tag">Daisena · Case No. 1993</div>
    <h1>The <span>Daisena</span> Awards</h1>
    <div class="line"></div>
    <p>Balsavimas prasidės vakaro metu.<br>Voting opens on the night.</p>
    <div class="stamp">Case still open</div>
  </main>
</body>
</html>
